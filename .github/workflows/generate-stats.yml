name: Generate Custom GitHub Stats & Graphs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Data and Generate SVG Graphs
        env:
          GRAPH_TOKEN: ${{ secrets.GRAPH_TOKEN }}
        run: node generate-stats.js

      - name: Commit and Push Generated Images
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add github-stats.svg top-langs.svg activity-graph.svg
          git commit -m "Automated update of custom analytics and graphs" || exit 0
          git push
