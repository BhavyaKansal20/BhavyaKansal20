name: Generate Custom Contribution Graph

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically updates every 6 hours
  workflow_dispatch: # Allows you to run it manually anytime

permissions:
  contents: write # Explicitly grants permission to push files back to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Data and Generate SVG Graph
        env:
          GITHUB_TOKEN: \${{ secrets.GRAPH_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          
          async function run() {
            const query = JSON.stringify({
              query: '{ user(login: \"BhavyaKansal20\") { contributionsCollection { contributionCalendar { weeks { contributionDays { contributionCount } } } } } }'
            });
            
            const res = await fetch('https://github.com', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
                'Content-Type': 'application/json',
                'User-Agent': 'node'
              },
              body: query
            });
            
            const body = await res.json();
            const weeks = body.data.user.contributionsCollection.contributionCalendar.weeks;
            const days = weeks.flatMap(w => w.contributionDays).slice(-30);
            
            let points = '';
            let areaPoints = '20,100 ';
            let currentX = 20;
            
            days.forEach((day, index) => {
              currentX = index * 20 + 20;
              const count = Math.min(day.contributionCount, 10);
              const currentY = 90 - (count * 6);
              points += currentX + ',' + currentY + ' ';
              areaPoints += currentX + ',' + currentY + ' ';
            });
            areaPoints += currentX + ',100';
            
            const svg = \`<svg xmlns=\"http://w3.org\" viewBox=\"0 0 620 120\" width=\"100%\" height=\"100%\" style=\"background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; border-radius:12px; border: 1px solid #00ffcc30;\">
              <text x=\"20\" y=\"28\" fill=\"#00ffcc\" font-size=\"14\" font-weight=\"700\" letter-spacing=\"0.5\">Bhavya's Contribution Graph</text>
              <defs>
                <linearGradient id=\"glow\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">
                  <stop offset=\"0%\" stop-color=\"#00ffcc\" stop-opacity=\"0.25\"/>
                  <stop offset=\"100%\" stop-color=\"#00ffcc\" stop-opacity=\"0.0\"/>
                </linearGradient>
              </defs>
              <polygon points=\"\${areaPoints}\" fill=\"url(#glow)\" />
              <polyline fill=\"none\" stroke=\"#00ffcc\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" points=\"\${points.trim()}\" />
              <line x1=\"20\" y1=\"100\" x2=\"\${currentX}\" y2=\"100\" stroke=\"#ffffff\" stroke-opacity=\"0.1\" stroke-width=\"1\" />
            </svg>\`;
            
            fs.writeFileSync('activity-graph.svg', svg);
          }
          run();
          "

      - name: Commit and Push Generated Image
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          git add activity-graph.svg
          git commit -m "Automated update of activity graph" || exit 0
          git push
                  <stop offset=\"100%\" stop-color=\"#00ffcc\" stop-opacity=\"0.0\"/>
                </linearGradient>
              </defs>
              <polygon points=\"\${areaPoints}\" fill=\"url(#glow)\" />
              <polyline fill=\"none\" stroke=\"#00ffcc\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" points=\"\${points.trim()}\" />
              <line x1=\"20\" y1=\"100\" x2=\"\${currentX}\" y2=\"100\" stroke=\"#ffffff\" stroke-opacity=\"0.1\" stroke-width=\"1\" />
            </svg>\`;
            
            fs.writeFileSync('activity-graph.svg', svg);
          }
          run();
          "

      - name: Commit and Push Generated Image
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          git add activity-graph.svg
          git commit -m "Automated update of activity graph" || exit 0
          git push
                  <stop offset=\"100%\" stop-color=\"#00ffcc\" stop-opacity=\"0.0\"/>
                </linearGradient>
              </defs>
              <polygon points=\"\${areaPoints}\" fill=\"url(#glow)\" />
              <polyline fill=\"none\" stroke=\"#00ffcc\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" points=\"\${points.trim()}\" />
              <line x1=\"20\" y1=\"100\" x2=\"\${currentX}\" y2=\"100\" stroke=\"#ffffff\" stroke-opacity=\"0.1\" stroke-width=\"1\" />
            </svg>\`;
            
            fs.writeFileSync('activity-graph.svg', svg);
          }
          run();
          "

      - name: Commit and Push Generated Image
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add activity-graph.svg
          git commit -m "Automated update of activity graph" || exit 0
          git push
